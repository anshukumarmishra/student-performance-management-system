{% extends 'core/base.html' %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
  <h2 style="margin-bottom: 20px;">Mark Attendance</h2>
  <form method="POST">
    {% csrf_token %}
    <div class="form-group">
      <label>Subject</label>
      <select name="subject" required>
        {% for s in subjects %}<option value="{{ s.id }}">{{ s.code }} - {{ s.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" name="date" required>
    </div>

    <h4 style="margin: 20px 0 10px 0;">Student Roster</h4>
    <table>
      <thead>
        <tr>
          <th>Student</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% for student in students %}
        <tr>
          <td>{{ student.username }}</td>
          <td>
            <select name="status_{{ student.id }}">
              <option value="PRESENT">Present</option>
              <option value="ABSENT">Absent</option>
            </select>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <button type="submit" class="btn btn-primary btn-block" style="margin-top: 20px;">Save Attendance</button>
  </form>
</div>
{% endblock %}
