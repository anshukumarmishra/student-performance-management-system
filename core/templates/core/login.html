{% extends 'core/base.html' %}

{% block content %}
<style>
  /* Form styling for Django form fields */
  .form-group p {
    margin-bottom: 12px;
  }
  .form-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 4px;
    font-size: 0.875rem;
    color: #475569;
  }
  .form-group input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus {
    border-color: #3b82f6;
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
  }
</style>

<div class="card shadow" style="max-width: 400px; margin: 50px auto; padding: 25px; border-radius: 10px; background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
  <h2 style="margin-bottom: 20px; text-align: center; color: #1e293b;">Portal Login</h2>
  
  <form method="POST">
    {% csrf_token %}
    
    <div class="form-group mb-3">
      {{ form.as_p }}
    </div>

    <!-- Styled Forgot Password Link Aligned to the Right -->
    <div style="text-align: right; margin-bottom: 15px; margin-top: -10px;">
      <a href="{% url 'password_reset' %}" 
         style="font-size: 0.85rem; color: #6c757d; text-decoration: none;" 
         onmouseover="this.style.color='#3b82f6'" 
         onmouseout="this.style.color='#6c757d'">
        Forgot Password?
      </a>
    </div>

    <button type="submit" class="btn btn-primary btn-block" style="width: 100%; padding: 10px; font-weight: 600; font-size: 0.9rem; background-color: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer;">Log In</button>
  </form>
</div>
{% endblock %}
