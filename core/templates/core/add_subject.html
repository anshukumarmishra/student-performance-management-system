{% extends 'core/base.html' %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 30px auto; padding: 30px; border-radius: 8px; background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
  <h2 style="margin-bottom: 20px; color: #1e293b; font-size: 1.25rem;">Create New Subject</h2>
  
  <form method="POST">
    {% csrf_token %}
    
    <div class="form-group" style="margin-bottom: 16px;">
      <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.875rem; color: #475569;">Subject Name</label>
      <input type="text" name="name" required placeholder="e.g. Data Structures & Algorithms" style="width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none;">
    </div>

    <div class="form-group" style="margin-bottom: 24px;">
      <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.875rem; color: #475569;">Subject Code</label>
      <input type="text" name="code" required placeholder="e.g. MCA-301" style="width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none;">
    </div>

    <div style="display: flex; gap: 12px;">
      <button type="submit" class="btn btn-primary" style="flex: 1; padding: 10px; font-weight: 600; background-color: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer;">Save Subject</button>
      <a href="{% url 'teacher_dashboard' %}" class="btn" style="background: #e2e8f0; color: #334155; text-align: center; padding: 10px 16px; text-decoration: none; border-radius: 6px; font-weight: 600;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
