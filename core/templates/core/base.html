<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPMS Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f8fafc; color: #334155; line-height: 1.5; }
    
    /* Navigation */
    nav { background-color: #1e293b; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    nav a.brand { color: white; text-decoration: none; font-weight: bold; font-size: 1.1rem; }
    .nav-user { display: flex; gap: 15px; align-items: center; font-size: 0.9rem; }
    
    /* Container & Layout */
    .container { max-width: 850px; margin: 30px auto; padding: 0 15px; }
    .card { background: white; border: 1px solid #e2e8f0; border-radius: 6px; padding: 20px; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }

    /* Forms & Inputs */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.875rem; }
    .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.9rem; }
    
    /* Buttons */
    .btn { display: inline-block; padding: 8px 14px; border-radius: 4px; border: none; font-weight: 600; font-size: 0.875rem; text-decoration: none; cursor: pointer; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-success { background: #10b981; color: white; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-block { width: 100%; text-align: center; margin-top: 10px; }

    /* Tables */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border-bottom: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 0.9rem; }
    th { background-color: #f1f5f9; font-weight: 600; }

    /* Lists & Stats */
    .stat-box { background: white; border: 1px solid #e2e8f0; border-left: 4px solid #3b82f6; padding: 15px; border-radius: 4px; }
    .stat-title { font-size: 0.8rem; color: #64748b; text-transform: uppercase; font-weight: 600; }
    .stat-value { font-size: 1.5rem; font-weight: bold; margin-top: 4px; }
    ul.simple-list { list-style: none; padding: 0; }
    ul.simple-list li { padding: 10px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'dashboard' %}" class="brand">SPMS Portal</a>
    {% if user.is_authenticated %}
    <div class="nav-user">
      <span>{{ user.username }} ({{ user.role }})</span>
      <a href="{% url 'logout' %}" class="btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;">Logout</a>
    </div>
    {% endif %}
  </nav>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
