{% extends 'core/base.html' %}
{% block content %}
<div class="card" style="max-width: 600px; margin: 30px auto; padding: 30px; border-radius: 8px; background: white; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);">
  <h2 style="margin-bottom: 20px; color: #1e293b; font-size: 1.25rem;">Enter Student Grades</h2>
  
  <form method="POST">
    {% csrf_token %}
    
    <div class="form-group" style="margin-bottom: 16px;">
      <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.875rem; color: #475569;">Subject</label>
      <select name="subject" required style="width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; background: #fff; outline: none;">
        <option value="" disabled selected>-- Select Subject --</option>
        {% for subject in subjects %}
          <option value="{{ subject.id }}">{{ subject.name }} ({{ subject.code }})</option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 16px;">
      <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.875rem; color: #475569;">Student</label>
      <select name="student" required style="width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; background: #fff; outline: none;">
        <option value="" disabled selected>-- Select Student --</option>
        {% for student in students %}
          <option value="{{ student.id }}">
            {{ student.username }} {% if student.student_profile %}[Roll No: {{ student.student_profile.roll_number }}]{% else %}[No Roll No]{% endif %}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 16px;">
      <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.875rem; color: #475569;">Exam Type</label>
      <select name="exam_type" required style="width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; background: #fff; outline: none;">
        <option value="MIDTERM">Mid-Term</option>
        <option value="ENDTERM">End-Term</option>
        <option value="QUIZ">Quiz</option>
      </select>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
      <div class="form-group" style="margin-bottom: 0;">
        <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.875rem; color: #475569;">Marks Obtained</label>
        <input type="number" step="0.01" name="marks_obtained" required placeholder="e.g. 85" style="width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none;">
      </div>
      <div class="form-group" style="margin-bottom: 0;">
        <label style="display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.875rem; color: #475569;">Max Marks</label>
        <input type="number" step="0.01" name="max_marks" value="100" required style="width: 100%; padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; outline: none;">
      </div>
    </div>

    <div style="display: flex; gap: 12px;">
      <button type="submit" class="btn btn-primary" style="flex: 1; padding: 10px; font-weight: 600; background-color: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer;">Save Grades</button>
      <a href="{% url 'teacher_dashboard' %}" class="btn" style="background: #e2e8f0; color: #334155; text-align: center; padding: 10px 16px; text-decoration: none; border-radius: 6px; font-weight: 600;">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
