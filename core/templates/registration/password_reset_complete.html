<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password updated | SPMS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f1f5f9;
            color: #1e293b;
            font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .card {
            width: min(100%, 460px);
            padding: 40px 36px;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 18px 45px rgb(15 23 42 / 9%);
            text-align: center;
        }
        .brand { margin: 0 0 8px; color: #2563eb; font-size: 0.9rem; font-weight: 700; }
        .icon {
            display: grid;
            width: 56px;
            height: 56px;
            margin: 22px auto;
            place-items: center;
            border-radius: 50%;
            background: #dcfce7;
            color: #15803d;
            font-size: 1.7rem;
            font-weight: 700;
        }
        h1 { margin: 0 0 12px; font-size: 1.7rem; }
        .message { margin: 0 0 26px; color: #64748b; }
        .button {
            display: block;
            padding: 12px 16px;
            border-radius: 8px;
            background: #2563eb;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
        .button:hover { background: #1d4ed8; }
        @media (max-width: 480px) { .card { padding: 30px 20px; } }
    </style>
</head>
<body>
    <main class="card">
        <p class="brand">SPMS · Student Portal</p>
        <div class="icon" aria-hidden="true">✓</div>
        <h1>Password updated</h1>
        <p class="message">Your password is ready. Sign in to continue to your academic dashboard.</p>
        <a class="button" href="https://student-performance-management-system-31uc.onrender.com/">Log in to the SPMS portal</a>
    </main>
</body>
</html>
