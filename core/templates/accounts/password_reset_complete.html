{% extends 'core/base.html' %}

{% block content %}
<div class="card shadow" style="max-width: 400px; margin: 50px auto; padding: 25px; border-radius: 10px; text-align: center;">
    <div style="font-size: 3rem; color: #198754; margin-bottom: 10px;">✓</div>
    <h3 style="margin-bottom: 15px; color: #333;">Password Reset Complete</h3>
    
    <p style="font-size: 0.9rem; color: #6c757d; margin-bottom: 25px;">
        Your password has been successfully updated. You can now log into your account using your new credentials.
    </p>
    
    <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2">Log In Now</a>
</div>
{% endblock %}
