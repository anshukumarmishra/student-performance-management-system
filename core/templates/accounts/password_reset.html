{% extends 'core/base.html' %}

{% block content %}
<div class="card shadow" style="max-width: 400px; margin: 50px auto; padding: 25px; border-radius: 10px;">
  <h2 style="margin-bottom: 15px; text-align: center; color: #333;">Forgot Password</h2>
  
  <p style="font-size: 0.9rem; color: #6c757d; text-align: center; margin-bottom: 20px;">
    Enter your registered email address below, and we will send you a link to reset your password.
  </p>
  
  <form method="POST">
    {% csrf_token %}
    
    <div class="form-group mb-3">
      {{ form.as_p }}
    </div>
    
    <button type="submit" class="btn btn-primary w-100 py-2 mt-2">Send Reset Link</button>
  </form>
  
  <div style="text-align: center; margin-top: 20px;">
    <a href="{% url 'login' %}" 
       style="font-size: 0.85rem; color: #6c757d; text-decoration: none;" 
       onmouseover="this.style.color='#0d6efd'" 
       onmouseout="this.style.color='#6c757d'">
      &larr; Back to Login
    </a>
  </div>
</div>
{% endblock %}
